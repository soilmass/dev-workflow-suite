# SPDX-License-Identifier: Apache-2.0
# Builds the plugin archive on a version tag, signs it with Sigstore keyless
# (DEC-07) and generates SLSA provenance. No SBOM: releases are markdown only (DEC-05).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Build archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          zip -qr "dev-workflow-${TAG}.zip" plugins/dev-workflow LICENSE LICENSE-docs THIRD_PARTY_NOTICES.md
      - name: Sign archive (keyless)
        env:
          TAG: ${{ github.ref_name }}
        run: cosign sign-blob --yes --bundle "dev-workflow-${TAG}.zip.sigstore.json" "dev-workflow-${TAG}.zip"
      - name: Hash for provenance
        id: hash
        env:
          TAG: ${{ github.ref_name }}
        run: echo "hashes=$(sha256sum "dev-workflow-${TAG}.zip" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dev-workflow-*

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA generator must be referenced by tag; its own docs require it.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dev-workflow-* --repo "$REPO" --clobber
