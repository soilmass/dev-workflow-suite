# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned tools
        run: bash scripts/ci/install_tools.sh
      - name: Shared standard is in sync (ARCH-09)
        run: python3 -I scripts/sync_standard.py --check
      - name: Skill format checks (ARCH, SAFE-01)
        run: python3 -I scripts/check_skills.py
      - name: Sync script test
        run: bash tests/test_sync.sh
      - name: Skill contracts (SKL rules)
        run: python3 -I scripts/check_suite.py
      - name: Enforcement tools catch broken cases
        run: bash tests/test_standards.sh
      - name: Agent Skills validator
        run: for d in plugins/*/skills/*/; do agentskills validate "$d"; done
      - name: Plugin and marketplace validation (PKG)
        run: claude plugin validate . && claude plugin validate plugins/dev-workflow
      - name: Secret scan over history (SEC-05, PKG-08)
        run: gitleaks git . --no-banner
      - name: DCO sign-off on every PR commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check_dco.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Plugin version raised since the last tag (PKG-12)
        run: bash scripts/ci/check_version.sh
